[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interopdb"
version = "0.2.0"
description = "Python client for the Interop DB Registry API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "click>=8.0",
]

[project.scripts]
interopdb = "interopdb.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
