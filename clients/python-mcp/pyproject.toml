[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interopdb-mcp"
version = "0.1.0"
description = "MCP server for Interop DB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "fastmcp>=2.0",
]

[project.scripts]
interopdb-mcp = "interopdb_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
